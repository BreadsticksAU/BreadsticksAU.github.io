<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <h1 class="title">University Hub</h1>
                <button id="themeToggle" class="theme-toggle">
                    <svg id="sunIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="moonIcon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>

            <!-- Tabs -->
            <div class="tabs">
                <button class="tab active" data-tab="timetable">Timetable</button>
                <button class="tab" data-tab="assessments">Assessments</button>
                <button class="tab" data-tab="settings">Settings</button>
                <button class="tab" data-tab="changelog">Changelog</button>
            </div>

            <!-- Tab Content -->
            <div id="timetableContent" class="tab-content active">
                <div class="timetable-grid">
                    <div class="day-column" data-day="Monday">
                        <div class="day-header">
                            <h2>Monday</h2>
                            <button class="add-card-btn" data-day="Monday">
                                <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="cards-container" id="monday-cards"></div>
                    </div>

                    <div class="day-column" data-day="Tuesday">
                        <div class="day-header">
                            <h2>Tuesday</h2>
                            <button class="add-card-btn" data-day="Tuesday">
                                <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="cards-container" id="tuesday-cards"></div>
                    </div>

                    <div class="day-column" data-day="Thursday">
                        <div class="day-header">
                            <h2>Thursday</h2>
                            <button class="add-card-btn" data-day="Thursday">
                                <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="cards-container" id="thursday-cards"></div>
                    </div>

                    <div class="day-column" data-day="Friday">
                        <div class="day-header">
                            <h2>Friday</h2>
                            <button class="add-card-btn" data-day="Friday">
                                <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                            </button>
                        </div>
                        <div class="cards-container" id="friday-cards"></div>
                    </div>
                </div>
            </div>

            <div id="assessmentsContent" class="tab-content">
                <div class="content-box">
                    <h2>Assessments</h2>
                    <p>Add your upcoming assessments and deadlines here.</p>
                </div>
            </div>

            <div id="settingsContent" class="tab-content">
                <div class="content-box">
                    <h2>Settings</h2>
                    <button id="resetTimetable" class="btn-danger">Reset Timetable</button>
                    <button id="clearChangelog" class="btn-danger" style="margin-left: 10px;">Clear Changelog</button>
                </div>
            </div>

            <div id="changelogContent" class="tab-content">
                <div class="content-box">
                    <h2>Changelog</h2>
                    <div id="changelogList" class="changelog-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Card</h3>
                <button id="closeModal" class="close-btn">
                    <svg class="icon-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Time</label>
                    <input type="text" id="editTime" class="form-input">
                </div>
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="editTitle" class="form-input">
                </div>
                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" class="form-input">
                </div>
                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="editNotes" class="form-input" rows="3"></textarea>
                </div>
                <div class="form-group">
                    <label>Color</label>
                    <div class="color-picker">
                        <button class="color-btn" data-color="blue"></button>
                        <button class="color-btn" data-color="yellow"></button>
                        <button class="color-btn" data-color="green"></button>
                        <button class="color-btn" data-color="orange"></button>
                        <button class="color-btn" data-color="red"></button>
                        <button class="color-btn" data-color="purple"></button>
                        <button class="color-btn" data-color="pink"></button>
                    </div>
                </div>
                <button id="deleteCard" class="btn-danger full-width">Delete Card</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
